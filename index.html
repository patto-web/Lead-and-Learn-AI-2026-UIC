<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong — Single or Two Player</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#101820; color:#f4f7fa; font-family:system-ui,sans-serif; }
  main { width:min(94vw,900px); text-align:center; padding:18px 0; }
  h1 { margin:0 0 6px; letter-spacing:.12em; }
  p { color:#bdc9d4; margin:6px 0 14px; }
  canvas { width:100%; height:auto; display:block; background:#071018; border:2px solid #314452; border-radius:10px; }
  .controls { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:10px; margin-top:12px; }
  button, select { border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:700; cursor:pointer; background:#45d6a5; color:#071018; }
  select { background:#e4edf3; }
  .hint { font-size:.9rem; }
  #status { min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>PONG</h1>
  <p>First to 5 points wins · The ball speeds up as rallies continue!</p>
  <canvas id="game" width="900" height="520" aria-label="Pong game"></canvas>
  <div class="controls">
    <label for="mode">Mode:</label>
    <select id="mode"><option value="single">Single player vs AI</option><option value="two">Two players</option></select>
    <button id="sound" aria-pressed="true">Sound: On</button>
    <button id="restart">Restart game</button>
  </div>
  <p class="hint" id="help">You: W / S · AI controls the right paddle</p>
  <p class="hint" id="status" aria-live="polite">Press W or S to start.</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('status');
  const modeSelect = document.getElementById('mode');
  const soundButton = document.getElementById('sound');
  const W = canvas.width, H = canvas.height;
  const keys = new Set();
  const BASE_PADDLE_H = 100, MIN_PADDLE_H = 48, PADDLE_W = 14;
  let left, right, ball, scores, running, winner, lastTime;
  let soundOn = true, audioCtx = null, rallyHits = 0;

  function playTone(freq, duration = 0.07, type = 'sine', volume = 0.045) {
    if (!soundOn) return;
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (_) { /* Audio may be unavailable in some browsers. */ }
  }
  function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
    ball = { x: W / 2, y: H / 2, r: 9, speed: 5, vx: direction * 5, vy: Math.random() * 3 - 1.5 };
    rallyHits = 0;
  }
  function resetGame() {
    left = { x: 35, y: (H - BASE_PADDLE_H) / 2, h: BASE_PADDLE_H };
    right = { x: W - 35 - PADDLE_W, y: (H - BASE_PADDLE_H) / 2, h: BASE_PADDLE_H };
    scores = [0, 0]; running = false; winner = null; lastTime = 0;
    resetBall();
    status.textContent = 'Press W or S to start.';
    draw();
  }
  function clampPaddle(p) { p.y = Math.max(0, Math.min(H - p.h, p.y)); }
  function scorePoint(player) {
    scores[player]++;
    playTone(player === 0 ? 660 : 440, 0.22, 'triangle', 0.07);
    // The human paddle gradually shrinks as the opponent scores.
    left.h = Math.max(MIN_PADDLE_H, BASE_PADDLE_H - scores[1] * 10);
    if (scores[player] >= 5) {
      winner = player === 0 ? 'You' : (modeSelect.value === 'single' ? 'AI' : 'Player 2');
      running = false;
      playTone(player === 0 ? 880 : 220, 0.45, 'sawtooth', 0.05);
      status.textContent = winner + ' wins! Click Restart game to play again.';
    } else {
      running = false;
      resetBall(player === 0 ? 1 : -1);
      status.textContent = (player === 0 ? 'You scored!' : (modeSelect.value === 'single' ? 'AI scored!' : 'Player 2 scored!')) + ' Press a movement key to continue.';
    }
  }
  function update(dt) {
    const scale = Math.min(dt / 16.67, 2);
    if (keys.has('w')) left.y -= 7 * scale;
    if (keys.has('s')) left.y += 7 * scale;
    if (modeSelect.value === 'two') {
      if (keys.has('arrowup')) right.y -= 7 * scale;
      if (keys.has('arrowdown')) right.y += 7 * scale;
    } else if (running && !winner) {
      // Basic AI: follows the ball with a speed cap and a little inaccuracy.
      const target = ball.y - right.h / 2;
      const aiSpeed = 4.2 + Math.min(rallyHits * 0.05, 1.2);
      const delta = target - right.y;
      right.y += Math.max(-aiSpeed * scale, Math.min(aiSpeed * scale, delta));
    }
    clampPaddle(left); clampPaddle(right);
    if (!running || winner) return;

    ball.x += ball.vx * scale; ball.y += ball.vy * scale;
    if (ball.y - ball.r <= 0 || ball.y + ball.r >= H) {
      ball.vy *= -1;
      ball.y = Math.max(ball.r, Math.min(H - ball.r, ball.y));
      playTone(300, 0.035, 'sine', 0.025);
    }
    if (ball.vx < 0 && ball.x - ball.r <= left.x + PADDLE_W &&
        ball.x > left.x && ball.y + ball.r >= left.y && ball.y - ball.r <= left.y + left.h) {
      ball.x = left.x + PADDLE_W + ball.r;
      rallyHits++;
      ball.speed = Math.min(ball.speed * 1.045, 12);
      ball.vx = Math.abs(ball.speed);
      ball.vy = ((ball.y - (left.y + left.h / 2)) / (left.h / 2)) * 6;
      playTone(520 + Math.min(rallyHits * 18, 360), 0.055, 'square', 0.035);
    }
    if (ball.vx > 0 && ball.x + ball.r >= right.x &&
        ball.x < right.x + PADDLE_W && ball.y + ball.r >= right.y && ball.y - ball.r <= right.y + right.h) {
      ball.x = right.x - ball.r;
      rallyHits++;
      ball.speed = Math.min(ball.speed * 1.045, 12);
      ball.vx = -Math.abs(ball.speed);
      ball.vy = ((ball.y - (right.y + right.h / 2)) / (right.h / 2)) * 6;
      playTone(520 + Math.min(rallyHits * 18, 360), 0.055, 'square', 0.035);
    }
    if (ball.x + ball.r < 0) scorePoint(1);
    if (ball.x - ball.r > W) scorePoint(0);
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#071018'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#314452'; ctx.lineWidth = 3; ctx.setLineDash([12, 14]);
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#f4f7fa'; ctx.font = 'bold 56px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(scores[0], W * 0.25, 75); ctx.fillText(scores[1], W * 0.75, 75);
    ctx.fillRect(left.x, left.y, PADDLE_W, left.h);
    ctx.fillRect(right.x, right.y, PADDLE_W, right.h);
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = '16px system-ui'; ctx.fillStyle = '#9db0bd';
    ctx.fillText('BALL SPEED ' + ball.speed.toFixed(1), W / 2, H - 18);
    if (!running) {
      ctx.fillStyle = 'rgba(7,16,24,.78)'; ctx.fillRect(0, H / 2 - 38, W, 76);
      ctx.fillStyle = '#45d6a5'; ctx.font = 'bold 26px system-ui';
      ctx.fillText(winner ? winner + ' wins!' : (scores[0] || scores[1] ? 'POINT SCORED' : 'PONG'), W / 2, H / 2 + 9);
    }
  }
  function frame(time) {
    const dt = lastTime ? time - lastTime : 16.67;
    lastTime = time; update(dt); draw(); requestAnimationFrame(frame);
  }
  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (['w', 's', 'arrowup', 'arrowdown'].includes(key)) {
      e.preventDefault(); keys.add(key);
      if (!winner && !running) { running = true; status.textContent = 'Game on!'; playTone(440, 0.05); }
    }
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());
  modeSelect.addEventListener('change', () => {
    document.getElementById('help').textContent = modeSelect.value === 'single'
      ? 'You: W / S · AI controls the right paddle'
      : 'Player 1: W / S · Player 2: ↑ / ↓';
    resetGame();
  });
  soundButton.addEventListener('click', () => {
    soundOn = !soundOn;
    soundButton.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    soundButton.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) playTone(660, 0.08);
  });
  document.getElementById('restart').addEventListener('click', resetGame);
  resetGame(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
